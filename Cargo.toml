[package]
name = "remote-web-desktop"
version = "0.1.0"
edition = "2024"
description = "Native Rust desktop control from a browser"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcap = "0.9.8"
enigo = "0.6.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
openh264 = "0.9.8"
font8x8 = "0.3"
hostname = "0.4"
fast_image_resize = { version = "6.1", features = ["image"] }
wtransport = "0.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[patch.crates-io]
# Narrow macOS event-ordering fix; see vendor/enigo/RWD_PATCH.md.
enigo = { path = "vendor/enigo" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
